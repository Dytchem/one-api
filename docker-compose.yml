
services:
  one-api:
    image: "${REGISTRY:-ghcr.io}/dytchem/one-api:latest"
    container_name: one-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data/oneapi:/data
      - ./logs:/app/logs
    environment:
      # 数据库连接串：可注释掉以使用 SQLite（数据存 /data）
      - SQL_DSN=${MYSQL_DSN:-oneapi:${MYSQL_PASSWORD:-123456}@tcp(db:3306)/one-api}
      - REDIS_CONN_STRING=redis://redis
      # 会话签名密钥：不设置则首次启动自动生成并持久化到 ./data/oneapi/session_secret（重启不变）
      - SESSION_SECRET=${SESSION_SECRET:-}
      # Agent / 聊天（pi-bridge）配置：容器内默认即可，无需改动
      # - AGENT_BRIDGE_URL=http://127.0.0.1:3005  # 默认已指向同容器 bridge，无需设置
      # - BRIDGE_PORT=3005
      - TZ=Asia/Shanghai
#      - NODE_TYPE=slave  # 多机部署时从节点取消注释该行
#      - SYNC_FREQUENCY=60  # 需要定期从数据库加载数据时取消注释该行
    depends_on:
      - redis
      - db
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' | awk -F: '{print $2}'" ]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: "${REGISTRY:-docker.io}/redis:latest"
    container_name: redis
    restart: always

  db:
    image: "${REGISTRY:-docker.io}/mysql:8.2.0"
    restart: always
    container_name: mysql
    volumes:
      - ./data/mysql:/var/lib/mysql  # 挂载目录，持久化存储
    environment:
      TZ: Asia/Shanghai   # 设置时区
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-OneAPI@justsong} # 强烈建议覆盖 root 密码
      MYSQL_USER: oneapi   # 创建专用用户
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}    # 强烈建议覆盖专用用户密码
      MYSQL_DATABASE: one-api   # 自动创建数据库
