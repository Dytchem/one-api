name: Publish Docker image

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 v0.6.11-dyt-1)'
        required: false
        default: ''
      tag_only:
        description: '仅构建指定 tag 版本'
        required: false
        default: 'false'
        type: boolean

jobs:
  push_to_registries:
    name: Push Docker image to GHCR
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set version from input
        if: inputs.version != ''
        # dyt-96/99: 输入经正则校验后再写入（防止 workflow_dispatch 输入被 shell 解释）
        # 支持 v1.2.3 与 v0.6.11-dyt-98 等带后缀格式
        run: |
          if [[ "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "${{ inputs.version }}" > VERSION
          else
            echo "invalid version input: ${{ inputs.version }}" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go vet & build
        run: |
          go vet ./...
          go build ./...

      - name: Node syntax check (pi-bridge)
        run: node --check pi-bridge/server.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable=${{ inputs.tag_only != 'true' && startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || inputs.version != '' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false

      - name: Clean up old versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: one-api
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: true
          token: ${{ secrets.GITHUB_TOKEN }}

  # dyt-102: 发布二进制（官方风格：单文件，tag 发布时附加到 release）
  release-assets:
    name: Release binaries (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: push_to_registries
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: ''
            asset: one-api
          - name: linux-arm64
            runner: ubuntu-latest
            goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
            asset: one-api-arm64
          - name: windows-amd64
            runner: ubuntu-latest
            goos: windows
            goarch: amd64
            cc: x86_64-w64-mingw32-gcc
            apt: gcc-mingw-w64-x86-64
            asset: one-api.exe
          - name: macos-amd64
            runner: macos-latest
            goos: darwin
            goarch: amd64
            cc: ''
            asset: one-api-macos
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install cross compiler (linux runners)
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        env:
          CC: ${{ matrix.cc }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          go build -trimpath -ldflags "-s -w" -o dist/${{ matrix.asset }} .

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
